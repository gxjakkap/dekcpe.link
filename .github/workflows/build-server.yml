name: Build User Facing Server Docker Image
on:
  push:
    paths:
      - "apps/api/**/*.go"
      - "apps/api/go.mod"
      - "apps/api/go.sum"
      - "apps/api/Dockerfile"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/dekcpe.link
  CI: true

jobs:
  publish-docker-image:
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Arch-Specific Image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.IMAGE_BASE }}:${{ matrix.arch }}
          platforms: linux/${{ matrix.arch }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.IMAGE_BASE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  create-manifest:
    needs: publish-docker-image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          # Use the exact tags from the matrix job
          AMD="${{ env.IMAGE_BASE }}:amd64"
          ARM="${{ env.IMAGE_BASE }}:arm64"
          TARGET="${{ env.IMAGE_BASE }}:latest"

          docker buildx imagetools create -t "$TARGET" "$AMD" "$ARM"

          echo "Multi-arch image created: $TARGET"
